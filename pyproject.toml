[project]
name = "sgtest-fcf"
version = "0.1.0"
description = "FCF Google Sheets model"
requires-python = ">=3.9"
dependencies = [
    "gspread>=5.7.0",
    "google-auth>=2.15.0",
    "google-auth-oauthlib>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]