[project]
name = "sgtest-fcf-model"
version = "0.1.0"
description = "FCF (Free Cash Flow) Model with Google Sheets Integration"
requires-python = ">=3.9"
dependencies = [
    "google-auth>=2.15.0",
    "google-api-python-client>=2.96.0",
    "gspread>=5.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]